# 1: Button
# 2: Light
# 3: Midlight
# 4: Dark
# 5: Mid
# 6: Text
# 7: BrightText
# 8: ButtonText
# 9: Base
# 10: Window
# 11: Shadow
# 12: Highlight
# 13: HighlightedText
