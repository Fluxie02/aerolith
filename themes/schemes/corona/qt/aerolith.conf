# AEROLITH / Corona — qt5ct and qt6ct colour scheme, with stock Fusion.
# QPalette role order (Qt 5.12+ / Qt 6; Qt 5 ignores the trailing Accent):
# 0: WindowText
# 1: Button
# 2: Light
# 3: Midlight
# 4: Dark
# 5: Mid
# 6: Text
# 7: BrightText
# 8: ButtonText
# 9: Base
# 10: Window
# 11: Shadow
# 12: Highlight
# 13: HighlightedText
# 14: Link
# 15: LinkVisited
# 16: AlternateBase
# 17: NoRole
# 18: ToolTipBase
# 19: ToolTipText
# 20: PlaceholderText
# 21: Accent
# All entries are opaque #AARRGGBB. Active/inactive retain readable selection.
# Font and optional rounded Widgets QSS are configured separately; see ../README.md.
[ColorScheme]
active_colors=#ffedf0ff, #ff2a3450, #ff35415f, #ff2a3450, #ff1e253c, #ff495a7b, #ffedf0ff, #ffff9591, #ffedf0ff, #ff101222, #ff1e253c, #ff101222, #ffa7bcff, #ff101222, #ffa7bcff, #ffb3e6bd, #ff1e253c, #ff101222, #ff2a3450, #ffedf0ff, #ffb6c0df, #ffa7bcff
inactive_colors=#ffedf0ff, #ff2a3450, #ff35415f, #ff2a3450, #ff1e253c, #ff495a7b, #ffedf0ff, #ffff9591, #ffedf0ff, #ff101222, #ff1e253c, #ff101222, #ffa7bcff, #ff101222, #ffa7bcff, #ffb3e6bd, #ff1e253c, #ff101222, #ff2a3450, #ffedf0ff, #ffb6c0df, #ffa7bcff
disabled_colors=#ffb6c0df, #ff2a3450, #ff35415f, #ff2a3450, #ff1e253c, #ff495a7b, #ffb6c0df, #ffb6c0df, #ffb6c0df, #ff101222, #ff1e253c, #ff101222, #ffa7bcff, #ff101222, #ffa7bcff, #ffb3e6bd, #ff1e253c, #ff101222, #ff2a3450, #ffb6c0df, #ffb6c0df, #ffa7bcff
