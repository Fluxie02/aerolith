# AEROLITH / Iris — qt5ct and qt6ct colour scheme, with stock Fusion.
# QPalette role order (Qt 5.12+ / Qt 6; Qt 5 ignores the trailing Accent):
# 0: WindowText
# 1: Button
# 2: Light
# 3: Midlight
# 4: Dark
# 5: Mid
# 6: Text
# 7: BrightText
# 8: ButtonText
# 9: Base
# 10: Window
# 11: Shadow
# 12: Highlight
# 13: HighlightedText
# 14: Link
# 15: LinkVisited
# 16: AlternateBase
# 17: NoRole
# 18: ToolTipBase
# 19: ToolTipText
# 20: PlaceholderText
# 21: Accent
# All entries are opaque #AARRGGBB. Active/inactive retain readable selection.
# Font and optional rounded Widgets QSS are configured separately; see ../README.md.
