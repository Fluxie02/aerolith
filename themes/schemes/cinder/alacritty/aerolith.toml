white = "#d4baaa"

[colors.bright]
black = "#d4baaa"
red = "#ffb0aa"
green = "#cae9c9"
yellow = "#ffda94"
blue = "#ccd9ef"
magenta = "#e9c7ef"
cyan = "#ccf2ef"
