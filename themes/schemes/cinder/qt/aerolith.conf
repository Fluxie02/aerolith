active_colors=#fffff0e4, #ff40322b, #ff4e3d34, #ff40322b, #ff30241f, #ff685144, #fffff0e4, #ffff9591, #fffff0e4, #ff1a1210, #ff30241f, #ff1a1210, #ffffc08a, #ff1a1210, #ffffc08a, #ffb3e6bd, #ff30241f, #ff1a1210, #ff40322b, #fffff0e4, #ffd4baaa, #ffffc08a
