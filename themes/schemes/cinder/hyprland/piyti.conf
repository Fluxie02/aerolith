# AEROLITH PIYTI / app rules, Hyprland 0.54 hyprlang syntax.
# Include this OR piyti.lua, and only one direction. Optional, never installed here.
# Exact class identities exclude steam_app_* game clients. Check hyprctl clients.
# Decorations apply only outside fullscreen/maximize; no focus or event overrides.
# PhotoCraft: upstream APP_ID, not a speculative suite-wide class.
windowrule = match:class ^ai\.storyteller\.photocraft$, match:fullscreen 0, rounding 20, border_size 2, border_color rgb(f6e2b3) rgb(685144), no_blur on, no_shadow on
windowrule = match:class ^ai\.storyteller\.photocraft$, match:modal 1, match:fullscreen 0, float on, center on
# firefox
windowrule = match:class ^(firefox|firefox-esr|org\.mozilla\.(firefox|Firefox))$, match:fullscreen 0, rounding 20, border_size 2, border_color rgb(f6e2b3) rgb(685144), no_blur on, no_shadow on
windowrule = match:class ^(firefox|firefox-esr|org\.mozilla\.(firefox|Firefox))$, match:modal 1, match:fullscreen 0, float on, center on
# libreoffice
windowrule = match:class ^(libreoffice(-writer|-calc|-impress|-draw|-base|-math|-startcenter)?|org\.libreoffice\.LibreOffice)$, match:fullscreen 0, rounding 20, border_size 2, border_color rgb(f6e2b3) rgb(685144), no_blur on, no_shadow on
windowrule = match:class ^(libreoffice(-writer|-calc|-impress|-draw|-base|-math|-startcenter)?|org\.libreoffice\.LibreOffice)$, match:modal 1, match:fullscreen 0, float on, center on
# steam
windowrule = match:class ^(steam|Steam)$, match:fullscreen 0, rounding 20, border_size 2, border_color rgb(f6e2b3) rgb(685144), no_blur on, no_shadow on
windowrule = match:class ^(steam|Steam)$, match:modal 1, match:fullscreen 0, float on, center on
# discord
windowrule = match:class ^(discord|Discord|discordcanary|discordptb|vesktop|Vesktop|com\.discordapp\.Discord|dev\.vencord\.Vesktop)$, match:fullscreen 0, rounding 20, border_size 2, border_color rgb(f6e2b3) rgb(685144), no_blur on, no_shadow on
windowrule = match:class ^(discord|Discord|discordcanary|discordptb|vesktop|Vesktop|com\.discordapp\.Discord|dev\.vencord\.Vesktop)$, match:modal 1, match:fullscreen 0, float on, center on

# Narrow English-title auxiliaries: omit or adapt titles for another locale.
# No rule catches all Steam/Discord windows or raises them over the active app.
windowrule = match:class ^(steam|Steam)$, match:title ^(Friends List|Steam Settings)$, match:fullscreen 0, float on, center on
windowrule = match:class ^(discord|Discord|vesktop|Vesktop)$, match:title ^Discord Popout$, match:fullscreen 0, float on, center on
windowrule = match:class ^(firefox|firefox-esr|org\.mozilla\.(firefox|Firefox))$, match:title ^Picture-in-Picture$, match:fullscreen 0, float on
