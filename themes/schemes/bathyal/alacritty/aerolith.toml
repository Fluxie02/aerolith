# AEROLITH / Bathyal — import from an existing Alacritty config.
[window]
padding = { x = 14, y = 14 }
opacity = 1.0
blur = false

[font]
size = 12.0
[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.primary]
background = "#091619"
foreground = "#e1f4f1"
