background = "#ceebac"

[colors.normal]
black = "#829691"
red = "#ff9591"
green = "#ceebac"
yellow = "#ffd071"
blue = "#a7c8ee"
magenta = "#d8b9e8"
cyan = "#b3e6bd"
white = "#abc0bd"

[colors.bright]
black = "#abc0bd"
red = "#ffb3af"
green = "#def3c7"
yellow = "#ffe0a0"
blue = "#c1dbfa"
magenta = "#ead0f5"
cyan = "#d0f4e0"
