# AEROLITH / Limb — import from an existing Alacritty config.
[window]
padding = { x = 14, y = 14 }
opacity = 1.0
blur = false

[font]
size = 12.0
[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.primary]
background = "#0d1215"
foreground = "#edf3f5"
[colors.cursor]
text = "#0d1215"
