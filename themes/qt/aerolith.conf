# AEROLITH / Limb — qt5ct and qt6ct colour scheme, with stock Fusion.
# QPalette role order (Qt 5.12+ / Qt 6; Qt 5 ignores the trailing Accent):
# 0: WindowText
# 1: Button
# 2: Light
# 3: Midlight
# 4: Dark
# 5: Mid
# 6: Text
# 7: BrightText
# 8: ButtonText
# 9: Base
# 10: Window
# 11: Shadow
# 12: Highlight
# 13: HighlightedText
# 14: Link
# 15: LinkVisited
# 16: AlternateBase
# 17: NoRole
# 18: ToolTipBase
# 19: ToolTipText
# 20: PlaceholderText
# 21: Accent
# All entries are opaque #AARRGGBB. Active/inactive retain readable selection.
# Font and optional rounded Widgets QSS are configured separately; see ../README.md.
[ColorScheme]
active_colors=#ffedf3f5, #ff25373a, #ff3b5253, #ff25373a, #ff1b282b, #ff3b5253, #ffedf3f5, #ffff9591, #ffedf3f5, #ff0d1215, #ff1b282b, #ff0d1215, #ffceebac, #ff0d1215, #ffceebac, #ffb3e6bd, #ff1b282b, #ff0d1215, #ff25373a, #ffedf3f5, #ffabc0bd, #ffceebac
inactive_colors=#ffedf3f5, #ff25373a, #ff3b5253, #ff25373a, #ff1b282b, #ff3b5253, #ffedf3f5, #ffff9591, #ffedf3f5, #ff0d1215, #ff1b282b, #ff0d1215, #ffceebac, #ff0d1215, #ffceebac, #ffb3e6bd, #ff1b282b, #ff0d1215, #ff25373a, #ffedf3f5, #ffabc0bd, #ffceebac
disabled_colors=#ffabc0bd, #ff25373a, #ff3b5253, #ff25373a, #ff1b282b, #ff3b5253, #ffabc0bd, #ffabc0bd, #ffabc0bd, #ff0d1215, #ff1b282b, #ff0d1215, #ffceebac, #ff0d1215, #ffceebac, #ffb3e6bd, #ff1b282b, #ff0d1215, #ff25373a, #ffabc0bd, #ffabc0bd, #ffceebac
